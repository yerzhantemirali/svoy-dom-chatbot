<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Чат-бот недвижимости</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout">
      <aside class="sidebar">
        <img class="sidebar-logo" src="./svoy_dom_logo.png" alt="Svoy Dom" />
        <div class="sidebar-title">Чаты</div>
        <div class="create-chat">
          <input id="phoneInput" placeholder="Введите номер, например +77770000008" />
          <button id="createChatBtn">Новый чат</button>
        </div>
        <div id="chatList" class="chat-list"></div>
      </aside>

      <section class="chat-area">
        <div id="chatHeader" class="chat-header">Выберите или создайте чат</div>
        <div id="messages" class="messages"></div>

        <form id="messageForm" class="composer hidden">
          <input id="messageInput" placeholder="Введите сообщение" />
          <button type="submit">Отправить</button>
        </form>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
